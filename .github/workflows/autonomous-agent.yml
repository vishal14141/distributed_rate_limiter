name: Autonomous AI Developer

on:
  workflow_dispatch:

jobs:
  day-2-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Launch Cursor Cloud Agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          curl --fail-with-body \
            -X POST \
            https://api.cursor.com/v1/agents \
            -u "$CURSOR_API_KEY:" \
            -H "Content-Type: application/json" \
            -d '{
              "prompt": {
                "text": "You are the autonomous developer for a 30-day software development experiment. Read AGENTS.md, PROJECT.md, and ROADMAP.md before doing anything. The repository is a distributed rate limiter. Day 1 is already complete. Your task for this run is ONLY Day 2: Basic rate limiter interfaces and configuration. Do not work on Day 3 or any later roadmap item. Implement the Day 2 requirements according to the existing architecture and project conventions. Inspect the existing code before making changes. Write clean production-quality Java 17 code and appropriate tests. Run the project formatting and verification/test commands before finishing. Update relevant documentation or ROADMAP.md to accurately reflect Day 2 completion if appropriate. Do not skip requirements and do not invent unrelated features. Do not modify production infrastructure. Never expose secrets. Do not force-push. When the Day 2 work is complete and tests pass, commit all Day 2 changes with a clear commit message and push the branch. Create a pull request for the Day 2 work. Then stop. Do not start Day 3."
              },
              "model": {
                "id": "grok-4.6",
                "params": [
                  {
                    "id": "effort",
                    "value": "medium"
                  },
                  {
                    "id": "fast",
                    "value": "false"
                  }
                ]
              },
              "repos": [
                {
                  "url": "https://github.com/vishal14141/distributed_rate_limiter",
                  "startingRef": "main"
                }
              ],
              "autoCreatePR": true
            }'