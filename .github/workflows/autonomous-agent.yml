name: Autonomous AI Developer

on:
  workflow_dispatch:

jobs:
  test-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Check Cursor models
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          curl --fail-with-body \
            https://api.cursor.com/v1/models \
            -u "$CURSOR_API_KEY:"