name: Autonomous AI Developer

on:
  workflow_dispatch:

jobs:
  test-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Call Cursor Cloud Agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          curl --fail-with-body \
            -X POST \
            https://api.cursor.com/v1/agents \
            -H "Authorization: Bearer $CURSOR_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "prompt": {
                "text": "You are participating in a 30-day autonomous software development experiment. Read AGENTS.md, PROJECT.md and ROADMAP.md from the repository. DO NOT MODIFY ANY FILES. DO NOT CREATE A COMMIT. DO NOT CREATE A PULL REQUEST. Report the current project state, the latest commit, whether Day 1 is complete, and the exact task planned for Day 2."
              },
              "source": {
                "repository": "https://github.com/vishal14141/distributed_rate_limiter",
                "ref": "main"
              }
            }'